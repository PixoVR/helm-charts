# Source: web-app/templates/cloudbuild.yaml
apiVersion: cloudbuild.cnrm.cloud.google.com/v1beta1
kind: CloudBuildTrigger
metadata:
  name: dev-sample-web-ci
  annotations:
    cnrm.cloud.google.com/project-id: app-project
  labels:
    namespace: test
spec:
  disabled: false
  github:
    owner: PixoVR
    name: apex-api 
    push:
      branch: "^dev$"

  substitutions:
    "_LIFECYCLE": dev
    "_APP_CODE": sample
    "_SERVICE_NAME": web
  build:
    timeout: 1800s
    options:
      machineType: E2_HIGHCPU_8

    step:
      - id: Store-SSH-Key
        name: 'gcr.io/cloud-builders/git'
        secretEnv: ['SSH_KEY']
        entrypoint: 'bash'
        args:
        - -c
        - |
          echo "$$SSH_KEY" >> /root/.ssh/id_rsa
          chmod 400 /root/.ssh/id_rsa
          cp known_hosts.github /root/.ssh/known_hosts
        volumes:
        - name: 'ssh'
          path: /root/.ssh

      - id: "Pull-Submodules"
        name: gcr.io/cloud-builders/git
        args: ['submodule', 'update', '--init', '--recursive']
        volumes:
        - name: 'ssh'
          path: /root/.ssh
      - id: GKE-Auth
        name: "gcr.io/cloud-builders/gcloud-slim"
        entrypoint: "bash"
        args:
          - "-c"
          - |
            gcloud components install kubectl &&
            gcloud container clusters get-credentials us-east-cluster --region=us-central1 --project=gke-project
        env:
          - KUBECONFIG=/workspace/kube/.config


      - id: "Build-Image"
        name: "gcr.io/kaniko-project/executor:v1.16.0"
        args:
          - --destination=gcr.io/app-project/sample/dev/web:$COMMIT_SHA
          - --destination=gcr.io/app-project/sample/dev/web:latest
          - --context=.
          - --dockerfile=Dockerfile
          - --cache=true
          - --cache-ttl=240h
        env:
          - HOME=/workspace
    availableSecrets:
      secretManager:
      - env: 'SSH_KEY'
        versionRef:
          external: projects/app-project/secrets/web-submodule-reader-key/versions/latest


