apiVersion: batch/v1
kind: Job
metadata:
  name: sftpgo-provision
  namespace: test
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: sample
        name: web-provision
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
      - name: provision
        image: python:3.13-alpine@sha256:79e7a9b9ff1cbceff819f856fb374477792a5967759d94df266de7b7b4120e6f
        command: ["python", "/provisioning/provision.py"]
        env:
        - name: SFTPGO_API_URL
          value: http://dev-sample-web-admin.test.svc:8080
        - name: SFTPGO_ADMIN_USERNAME
          value: "provisioner"
        - name: SFTPGO_BUCKET
          value: "us-east-dev-sample-web-sftp"
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: provisioning
          mountPath: /provisioning
          readOnly: true
        - name: admin
          mountPath: /secrets/admin
          readOnly: true
        - name: passwords
          mountPath: /secrets/passwords
          readOnly: true
      volumes:
      - name: provisioning
        configMap:
          name: sftpgo-provisioning
      - name: admin
        secret:
          secretName: sftpgo-admin
      - name: passwords
        secret:
          secretName: sftpgo-account-passwords

